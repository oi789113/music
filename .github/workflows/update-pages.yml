name: Update daily music charts
on:
  schedule:
    - cron: '10 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-music-pages
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Refresh charts and build the static website
        run: node build-pages.mjs
      - name: Publish updated site files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs
          if ! git diff --cached --quiet; then
            git commit -m 'Update daily music charts'
            git push
          fi
